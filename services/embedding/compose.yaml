name: smartfruit-e5
services:
  api:
    build: .
    image: smartfruit-e5:local
    restart: unless-stopped
    environment:
      EMBEDDING_SERVICE_TOKEN: ${EMBEDDING_SERVICE_TOKEN:?Set a random token of at least 32 characters}
      EMBEDDING_WARMUP: "1"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - model-cache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8080/health/ready',headers={'Authorization':'Bearer '+os.environ['EMBEDDING_SERVICE_TOKEN']}); urllib.request.urlopen(r,timeout=5)"]
      start_period: 180s
      interval: 30s
      timeout: 6s
      retries: 3
  worker:
    build: .
    image: smartfruit-e5:local
    restart: unless-stopped
    profiles: [worker]
    command: ["python", "worker.py", "--limit", "4"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - model-cache:/home/app/.cache/huggingface
volumes:
  model-cache:
